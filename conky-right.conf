conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'DejaVu Sans Mono:size=9',
    gap_x = 20,
    gap_y = 35,
    minimum_width = 240,
    maximum_width = 300,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    own_window = true,
    own_window_argb_visual = true,
    own_window_argb_value = 185,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    text_buffer_size = 4096,
    update_interval = 2.0,
    uppercase = false,
    use_xft = true,
}

conky.text = [[
${color grey}Info:${hr 2}

${color white}Uptime: ${color grey}$uptime
${color white}Frequency (in MHz): ${color grey}${freq}
${color white}Frequency (in GHz): ${color grey}${freq_g} ${color white}
${color white}RAM Usage: ${color grey}$mem / $memmax - $memperc% ${membar 7,160}
${color white}Swap Usage: ${color grey}$swap / $swapmax - $swapperc% ${swapbar 7,160}
${color white}CPU Uses: ${color grey}${cpu}% ${cpubar 7,160}
${color white}Processes: ${color grey}$processes Running: $running_processes

${color grey}File systems:${hr 2}
${color white}/ ${color grey}${fs_used /}/${fs_size /} ${fs_bar 7,160 /}

${color grey}Networking:${hr 2}
${color white}Up: ${color grey}${upspeed *} ${color white}Down: ${color grey}${downspeed *}

${color grey}Top procesos:${hr 2}
${color white}${top name 1} ${color grey}${top pid 1} ${top cpu 1}% ${top mem 1}%
${color white}${top name 2} ${color grey}${top pid 2} ${top cpu 2}% ${top mem 2}%
${color white}${top name 3} ${color grey}${top pid 3} ${top cpu 3}% ${top mem 3}%
${color white}${top name 4} ${color grey}${top pid 4} ${top cpu 4}% ${top mem 4}%
]]
